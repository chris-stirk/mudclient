<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUD Client</title>
<style>
:root {
  --bg: #12141a; --panel: #1a1d26; --line: #2b3040; --text: #d6d9e0; --dim: #7c8296;
  --accent: #4fb3ff; --good: #55d38a; --bad: #ff6b6b;
  --room: #2a3042; --room-line: #5b6480; --edge: #4a5270;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header .status { color: var(--dim); margin-left: auto; }
header .status.on { color: var(--good); }
input, button, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; background: var(--room); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #07131f; border-color: var(--accent); font-weight: 600; }
#host { width: 200px; } #port { width: 80px; }
main { flex: 1; display: flex; min-height: 0; }
#term { flex: 1 1 60%; display: flex; flex-direction: column; min-width: 0; }
#splitH { flex: 0 0 6px; cursor: row-resize; background: var(--line); touch-action: none; }
#splitH:hover, #splitH.on { background: var(--accent); }
#out, #live { flex: 1; overflow-y: auto; padding: 10px 12px; font: 14px/1.35 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; word-break: break-word; }
#out { min-height: 60px; }
#live { flex: 0 0 var(--live-h, 160px); }
#f { display: flex; padding: 8px; gap: 8px; border-top: 1px solid var(--line); background: var(--panel); }
#cmd { flex: 1; font-family: Consolas, "Cascadia Mono", monospace; }
#mapPane { flex: 0 0 var(--map-w, 40%); min-width: 120px; display: flex; flex-direction: column; background: var(--panel); }
#split { flex: 0 0 6px; cursor: col-resize; background: var(--line); touch-action: none; }
#split:hover, #split.on { background: var(--accent); }
.bar { display: flex; gap: 6px; padding: 6px 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.bar .grow { flex: 1; color: var(--dim); min-width: 80px; }
#mapWrap { flex: 1; position: relative; min-height: 120px; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#sel { color: var(--text); }
details { padding: 6px 8px; border-top: 1px solid var(--line); }
details label { display: block; margin: 6px 0; color: var(--dim); }
details input[type=text], details textarea { width: 100%; margin-top: 3px; box-sizing: border-box; font-family: monospace; }
.sys { color: var(--dim); font-style: italic; }
.err { color: var(--bad); }
@media (max-width: 800px) {
  main { flex-direction: column; }
  #mapPane { border-top: 1px solid var(--line); flex: 0 0 45%; }
  #split { display: none; }
}
</style>
</head>
<body>
<header>
  <input id="host" placeholder="host" value="aardmud.org" spellcheck="false">
  <input id="port" placeholder="port" value="4000" inputmode="numeric">
  <button id="connect" class="primary">Connect</button>
  <span id="status" class="status">Disconnected</span>
</header>
<main>
  <section id="term">
    <div id="out" aria-live="polite"></div>
    <div id="splitH" title="Drag to resize the live area (double-click to reset)" hidden></div>
    <div id="live" aria-hidden="true" hidden></div>
    <form id="f" autocomplete="off">
      <input id="cmd" placeholder="Type a command (use ; to separate several)" spellcheck="false" autocapitalize="off">
      <button>Send</button>
    </form>
  </section>
  <div id="split" title="Drag to resize (double-click to reset)"></div>
  <aside id="mapPane">
    <div class="bar">
      <button id="zDown" title="Level down">▼</button>
      <span id="zLabel">Z 0</span>
      <button id="zUp" title="Level up">▲</button>
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="center" title="Re-centre on you and follow">Centre</button>
      <span class="grow" id="coords"></span>
    </div>
    <div class="bar">
      <select id="mapSel" class="grow" title="Saved maps"></select>
      <button id="mapNew" title="Start a new empty map">New</button>
      <button id="mapSaveAs" title="Save a copy of this map under a new name">Save as</button>
      <button id="mapDelete" title="Delete the selected map">Delete</button>
    </div>
    <div class="bar">
      <input id="find" class="grow" placeholder="Find room by name (Enter for next)" spellcheck="false">
    </div>
    <div class="bar" id="selBar" hidden>
      <span id="sel" class="grow"></span>
      <button id="here">Set here</button>
      <button id="walk">Walk</button>
      <button id="rename">Name</button>
      <button id="del">Delete</button>
    </div>
    <div id="mapWrap"><canvas id="map"></canvas></div>
    <details>
      <summary>Mapper settings</summary>
      <label><input type="checkbox" id="mapOn" checked> Track movement</label>
      <label><input type="checkbox" id="nameOn"> Use first line of output as room name</label>
      <label>Failed-move pattern (regex)
        <input type="text" id="blocked" spellcheck="false">
      </label>
      <label>Prompt pattern (regex; each speedwalk step prints one)
        <input type="text" id="promptRe" spellcheck="false">
      </label>
      <label>Speedwalk finished pattern (regex)
        <input type="text" id="doEnd" spellcheck="false">
      </label>
      <label>MUD aliases to map (paste your alias list: <span id="aliasCount">0 recognised</span>)
        <textarea id="aliases" rows="5" spellcheck="false" placeholder="home = do n,2e,se,14e&#10;alias market do 3n,2e&#10;#alias gate {n;n;e}"></textarea>
      </label>
      <div class="bar" style="border:0;padding:6px 0 0">
        <button id="export">Export</button>
        <button id="import">Import</button>
        <button id="clear">Clear map</button>
        <input type="file" id="file" accept="application/json" hidden>
      </div>
    </details>
  </aside>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  keys() { try { return Object.keys(localStorage); } catch (e) { return []; } },
};

/* ---------- ANSI output ---------- */
const BASIC = ["#000000","#cc3333","#33aa55","#ccaa33","#4477dd","#bb55bb","#33aaaa","#cccccc",
               "#666666","#ff5555","#55ee77","#ffee55","#6699ff","#ff77ff","#55eeee","#ffffff"];
function color256(n) {
  if (n < 16) return BASIC[n];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
  n -= 16;
  const c = i => i ? 55 + i * 40 : 0;
  return `rgb(${c(Math.floor(n / 36))},${c(Math.floor(n / 6) % 6)},${c(n % 6)})`;
}
const out = $("out"), live = $("live");
/* While scrolled up through history, a pinned copy of the newest output stays visible below. */
const atBottom = () => out.scrollHeight - out.scrollTop - out.clientHeight < 40;
const LIVE_MAX = 400, OUT_MAX = 4000;
function setLive(show) {
  if (show && live.hidden) {
    live.textContent = "";
    for (const n of Array.prototype.slice.call(out.childNodes, -LIVE_MAX)) live.appendChild(n.cloneNode(true));
  }
  $("splitH").hidden = live.hidden = !show;
  if (show) live.scrollTop = live.scrollHeight;
}
const syncLive = () => setLive(!atBottom());
out.addEventListener("scroll", syncLive);

/* Output is gathered in a fragment and written once per frame (or after 100ms if the tab is hidden),
   so a burst of chunks costs one layout instead of one per chunk. */
let outFrag = document.createDocumentFragment(), flushQueued = false;
function queueFlush() {
  if (flushQueued) return;
  flushQueued = true;
  requestAnimationFrame(flushOut);
  setTimeout(flushOut, 100);
}
function flushOut() {
  if (!flushQueued) return;
  flushQueued = false;
  if (!outFrag.firstChild) return;
  const stick = atBottom(), frag = outFrag;
  outFrag = document.createDocumentFragment();
  if (!live.hidden) {
    live.appendChild(frag.cloneNode(true));
    while (live.childNodes.length > LIVE_MAX) live.removeChild(live.firstChild);
  }
  out.appendChild(frag);
  while (out.childNodes.length > OUT_MAX) out.removeChild(out.firstChild);
  if (stick) out.scrollTop = out.scrollHeight;
  setLive(!stick);
}
let sgr = {}, partialEsc = "";

function applySgr(params) {
  const p = params === "" ? [0] : params.split(";").map(Number);
  for (let i = 0; i < p.length; i++) {
    const n = p[i];
    if (n === 0) sgr = {};
    else if (n === 1) sgr.bold = true;
    else if (n === 2) sgr.faint = true;
    else if (n === 3) sgr.italic = true;
    else if (n === 4) sgr.underline = true;
    else if (n === 7) sgr.inverse = true;
    else if (n === 22) { sgr.bold = false; sgr.faint = false; }
    else if (n === 23) sgr.italic = false;
    else if (n === 24) sgr.underline = false;
    else if (n === 27) sgr.inverse = false;
    else if (n >= 30 && n <= 37) sgr.fg = BASIC[n - 30];
    else if (n >= 90 && n <= 97) sgr.fg = BASIC[n - 90 + 8];
    else if (n === 39) delete sgr.fg;
    else if (n >= 40 && n <= 47) sgr.bg = BASIC[n - 40];
    else if (n >= 100 && n <= 107) sgr.bg = BASIC[n - 100 + 8];
    else if (n === 49) delete sgr.bg;
    else if ((n === 38 || n === 48) && p[i + 1] === 5) { sgr[n === 38 ? "fg" : "bg"] = color256(p[i + 2]); i += 2; }
    else if ((n === 38 || n === 48) && p[i + 1] === 2) { sgr[n === 38 ? "fg" : "bg"] = `rgb(${p[i + 2]},${p[i + 3]},${p[i + 4]})`; i += 4; }
  }
}
function addSpan(text, cls) {
  if (!text) return;
  const s = document.createElement("span");
  s.textContent = text;
  if (cls) s.className = cls;
  else {
    let fg = sgr.fg, bg = sgr.bg;
    if (sgr.inverse) [fg, bg] = [bg || "#12141a", fg || "#d6d9e0"];
    if (sgr.bold && !sgr.fg) fg = "#ffffff";
    if (fg) s.style.color = fg;
    if (bg) s.style.background = bg;
    if (sgr.bold) s.style.fontWeight = "bold";
    if (sgr.faint) s.style.opacity = ".6";
    if (sgr.italic) s.style.fontStyle = "italic";
    if (sgr.underline) s.style.textDecoration = "underline";
  }
  outFrag.appendChild(s);
}
function print(text, cls) {
  if (cls) addSpan(text, cls);
  else {
    text = partialEsc + text.replace(/\r/g, "");
    partialEsc = "";
    const tail = text.match(/\x1b(\[[0-9;?]*)?$/);
    if (tail) { partialEsc = tail[0]; text = text.slice(0, -tail[0].length); }
    const re = /\x1b\[([0-9;?]*)([A-Za-z])/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      addSpan(text.slice(last, m.index));
      if (m[2] === "m") applySgr(m[1]);
      last = re.lastIndex;
    }
    addSpan(text.slice(last));
  }
  queueFlush();
}
const stripAnsi = t => t.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "").replace(/\r/g, "");

/* ---------- connection ---------- */
let ws = null, connected = false;
function setStatus(text, on) { const s = $("status"); s.textContent = text; s.classList.toggle("on", !!on); }

function connect() {
  const host = $("host").value.trim(), port = $("port").value.trim();
  if (!host || !port) return;
  store.set("mud:last", JSON.stringify({ host, port }));
  mapper.load(host, port);
  setStatus("Connecting…");
  ws = new WebSocket(`ws://${location.host}/ws?host=${encodeURIComponent(host)}&port=${encodeURIComponent(port)}`);
  const mine = ws;
  ws.onopen = () => { connected = true; setStatus(`Connected to ${host}:${port}`, true); $("connect").textContent = "Disconnect"; $("cmd").focus(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === "data") { print(m.d); mapper.onData(stripAnsi(m.d)); }
    else if (m.t === "echo") $("cmd").type = m.on ? "password" : "text";
    else if (m.t === "error") print(m.d + "\n", "err");
    else if (m.t === "closed") print("\n[Connection closed by host]\n", "sys");
  };
  ws.onclose = () => {
    if (ws !== mine) return;
    connected = false; ws = null;
    setStatus("Disconnected"); $("connect").textContent = "Connect"; $("cmd").type = "text";
    mapper.cancelWalk(); mapper.reset();
  };
}
$("connect").onclick = () => { if (ws) ws.close(); else connect(); };

function sendCommand(raw, echo = true) {
  if (!connected) { print("[Not connected]\n", "sys"); return; }
  for (const part of raw.split(";")) {
    const cmd = part.trim();
    if (!cmd && raw.indexOf(";") >= 0) continue;
    if (echo && $("cmd").type !== "password") print("> " + cmd + "\n", "sys");
    ws.send(JSON.stringify({ t: "send", d: cmd }));
    mapper.onCommand(cmd);
  }
}

const history = []; let hpos = 0;
$("f").onsubmit = e => {
  e.preventDefault();
  const v = $("cmd").value;
  if (v && $("cmd").type !== "password" && history[history.length - 1] !== v) history.push(v);
  hpos = history.length;
  sendCommand(v);
  $("cmd").select();
};
$("cmd").onkeydown = e => {
  if (e.key === "ArrowUp" && hpos > 0) { $("cmd").value = history[--hpos]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hpos = Math.min(hpos + 1, history.length); $("cmd").value = history[hpos] || ""; e.preventDefault(); }
};

/* ---------- mapper ---------- */
const VEC = { n:[0,-1,0], s:[0,1,0], e:[1,0,0], w:[-1,0,0], ne:[1,-1,0], nw:[-1,-1,0], se:[1,1,0], sw:[-1,1,0], u:[0,0,1], d:[0,0,-1] };
const LONG = { north:"n", south:"s", east:"e", west:"w", northeast:"ne", northwest:"nw", southeast:"se", southwest:"sw", up:"u", down:"d" };
const FORWARD = [[1, 0], [0, 1], [1, 1], [1, -1]];
const DEFAULT_BLOCKED ="can'?t go that way|cannot go that way|no (obvious )?exit|alas, you cannot|you can'?t move|door is (closed|locked)|is locked|there is no way|not possible|you are too (tired|exhausted)";

const mapper = {
  key: null,
  data: { rooms: {}, edges: {}, cur: null },
  pending: [],
  walk: null,
  selected: null,
  view: { cx: 0, cy: 0, scale: 40, z: 0, follow: true },
  batch: null,
  opts: { on: true, name: false, blocked: DEFAULT_BLOCKED, aliases: "", prompt: "HP:\\d+ EP:\\d+>", doEnd: "Do: Commands completed" },
  aliasMap: {},

  parseAliases(text) {
    const map = {};
    /* Drop pager noise, then fold wrapped continuation lines (indented deeper, or after a trailing comma) into their alias. */
    const lines = text.split(/\r?\n/).filter(l => l.trim() && !/^\s*--more--/i.test(l) && !/^\s*>\s*$/.test(l));
    const indent = l => l.match(/^\s*/)[0].replace(/\t/g, "    ").length;
    const base = Math.min(...lines.map(indent));
    const entries = [];
    for (const l of lines) {
      if (entries.length && (indent(l) > base + 3 || entries[entries.length - 1].endsWith(","))) entries[entries.length - 1] += " " + l.trim();
      else entries.push(l.trim());
    }
    for (const line of entries) {
      if (/^(\/\/|#\s)/.test(line)) continue;
      const m = line.match(/^(?:[#\/]?alias\s+)?(\S+?)\s*(?:=>|->|=|:)\s*(.+)$/i) ||
                line.match(/^(?:[#\/]?alias\s+)?(\S+(?:\s+\S+)+?)\s+=\s+(.+)$/i) ||
                line.match(/^(?:[#\/]?alias\s+)?(\S+)\s+(.+)$/i);
      if (!m) continue;
      const body = m[2].trim().replace(/^[{"']+|[}"']+$/g, "");
      if (body) map[m[1].toLowerCase().replace(/\s+/g, " ")] = body;
    }
    this.aliasMap = map;
    return Object.keys(map).filter(k => this.expand(k, 0).some(Boolean)).length;
  },
  /* The steps a command would take, following aliases and 3n2e-style speedwalks: a direction for each
     compass step, and null for any other step so that the list still lines up with the MUD's output. */
  expand(cmd, depth) {
    const steps = p => { const r = this.expand(p, depth + 1); return r.length ? r : [null]; };
    const c = cmd.trim().toLowerCase().replace(/\s+/g, " ");
    const doList = c.match(/^do\s+(.+)$/);
    if (doList && depth <= 5) return doList[1].split(",").flatMap(steps);
    const body = !VEC[LONG[c] || c] && depth <= 5 && (this.aliasMap[c] || this.aliasMap[c.split(" ")[0]]);
    if (body) return body.split(";").flatMap(steps);
    return this.expandStep(c, depth);
  },
  expandStep(cmd, depth) {
    const c = cmd.trim().toLowerCase().replace(/\s+/g, " "), d = LONG[c] || c;
    if (VEC[d]) return [d];
    if (depth > 5 || !c) return [];
    const marked = c.match(/^.+?\s*@(\S+)$/);
    if (marked) return this.expandStep(marked[1], depth + 1);
    if (/\d/.test(c) && /^(\d*(ne|nw|se|sw|n|s|e|w|u|d))+$/.test(c)) {
      const dirs = [];
      for (const [, n, dir] of c.matchAll(/(\d*)(ne|nw|se|sw|n|s|e|w|u|d)/g)) for (let i = +n || 1; i > 0; i--) dirs.push(dir);
      return dirs;
    }
    return [];
  },

  /* Maps are stored as "mudmap:<name>". Each server opens its default map (named host:port)
     unless a different one was chosen for it. */
  load(host, port) {
    this.server = `${host}:${port}`;
    this.open(store.get("mud:map:" + this.server) || "mudmap:" + this.server);
  },
  open(key) {
    this.flush();
    this.key = key;
    try { this.data = JSON.parse(store.get(key)) || { rooms: {}, edges: {}, cur: null }; }
    catch (e) { this.data = { rooms: {}, edges: {}, cur: null }; }
    this.reset(); this.selected = null; $("selBar").hidden = true;
    this.view.follow = true; this.syncView(); this.refreshMaps(); this.render();
  },
  choose(key) { store.set("mud:map:" + this.server, key); this.open(key); },
  save() {
    clearTimeout(this._t);
    this._t = setTimeout(() => this.flush(), 300);
  },
  flush() {
    clearTimeout(this._t);
    if (this.key) store.set(this.key, JSON.stringify(this.data));
  },
  mapNames() {
    const names = new Set(store.keys().filter(k => k.startsWith("mudmap:")));
    if (this.key) names.add(this.key);
    return [...names].sort();
  },
  refreshMaps() {
    const sel = $("mapSel");
    sel.textContent = "";
    for (const k of this.mapNames()) {
      const o = document.createElement("option");
      o.value = k; o.textContent = k.slice(7); o.selected = k === this.key;
      sel.appendChild(o);
    }
  },
  rk: (x, y, z) => `${x},${y},${z}`,
  ensureRoom(x, y, z) {
    const k = this.rk(x, y, z);
    if (!this.data.rooms[k]) this.data.rooms[k] = { x, y, z, name: "" };
    return k;
  },
  edgeKey: (a, b) => a < b ? `${a}|${b}` : `${b}|${a}`,

  onCommand(cmd) {
    if (!this.opts.on) return;
    const steps = this.expand(cmd, 0), c = cmd.trim().toLowerCase();
    if (steps.some(Boolean)) { this.pending.push({ steps, single: !!VEC[LONG[c] || c] }); if (this.pending.length > 50) this.pending.shift(); }
  },
  _res: {},
  re(src, flags) {
    const k = (flags || "") + "/" + src;
    if (!(k in this._res)) {
      try { this._res[k] = src ? new RegExp(src, flags) : null; } catch (e) { this._res[k] = null; }
    }
    const re = this._res[k];
    if (re) re.lastIndex = 0;
    return re;
  },
  reset() {
    this.pending.length = 0;
    if (this.batch) { clearTimeout(this.batch.timer); this.batch = null; }
  },
  onData(plain) {
    if (!this.opts.on) return;
    if (!this.batch) {
      if (!this.pending.length) return;
      const e = this.pending.shift();
      if (e.single) {
        const blocked = this.re(this.opts.blocked, "i");
        if (blocked && blocked.test(plain)) this.cancelWalk(); else this.move(e.steps[0], plain);
        return;
      }
      this.batch = { steps: e.steps, text: "", timer: null };
    }
    /* A speedwalk or alias answers over several chunks: collect them until it reports it has finished. */
    const b = this.batch, end = this.re(this.opts.doEnd);
    b.text += plain;
    clearTimeout(b.timer);
    if (end && end.test(b.text)) this.finishBatch();
    else b.timer = setTimeout(() => this.finishBatch(), 2500);
  },
  /* Each step prints a prompt, so the text after the Nth prompt is the result of the Nth step. */
  finishBatch() {
    const b = this.batch;
    if (!b) return;
    clearTimeout(b.timer); this.batch = null;
    const blocked = this.re(this.opts.blocked, "i"), prompt = this.re(this.opts.prompt, "g");
    const marks = prompt ? [...b.text.matchAll(prompt)] : [];
    const segs = marks.map((m, i) => b.text.slice(m.index + m[0].length, i + 1 < marks.length ? marks[i + 1].index : undefined));
    if (!segs.length) {
      if (blocked && blocked.test(b.text)) { this.cancelWalk(); return; }
      b.steps.forEach((dir, i) => dir && this.move(dir, i === b.steps.length - 1 ? b.text : ""));
      return;
    }
    let failed = false;
    for (let i = 0; i < b.steps.length && i < segs.length; i++) {
      if (!b.steps[i]) continue;
      if (blocked && blocked.test(segs[i])) failed = true; else this.move(b.steps[i], segs[i]);
    }
    if (failed) this.cancelWalk();
  },
  move(dir, plain) {
    const r = this.data.rooms;
    if (!this.data.cur || !r[this.data.cur]) this.data.cur = this.ensureRoom(0, 0, 0);
    const from = r[this.data.cur], v = VEC[dir];
    const to = this.ensureRoom(from.x + v[0], from.y + v[1], from.z + v[2]);
    this.data.edges[this.edgeKey(this.data.cur, to)] = 1;
    this.data.cur = to;
    if (this.opts.name && !r[to].name) {
      const line = plain.split("\n").map(s => s.trim()).find(s => s && !s.startsWith(">"));
      if (line) r[to].name = line.slice(0, 60);
    }
    this.save(); this.syncView(); this.render();
    this.stepWalk();
  },

  neighbours(k) {
    const room = this.data.rooms[k], res = [];
    for (const d in VEC) {
      const v = VEC[d], nk = this.rk(room.x + v[0], room.y + v[1], room.z + v[2]);
      if (this.data.edges[this.edgeKey(k, nk)]) res.push([d, nk]);
    }
    return res;
  },
  path(from, to) {
    const prev = { [from]: null }, queue = [from];
    while (queue.length) {
      const k = queue.shift();
      if (k === to) break;
      for (const [d, nk] of this.neighbours(k)) if (!(nk in prev)) { prev[nk] = [k, d]; queue.push(nk); }
    }
    if (!(to in prev)) return null;
    const dirs = [];
    for (let k = to; prev[k]; k = prev[k][0]) dirs.unshift(prev[k][1]);
    return dirs;
  },
  startWalk(to) {
    const from = this.data.cur;
    if (!connected) return print("[Not connected]\n", "sys");
    if (!from) return;
    const dirs = this.path(from, to);
    if (!dirs) return print("[No known route there]\n", "sys");
    if (!dirs.length) return;
    this.walk = { dirs, waiting: false };
    this.stepWalk();
  },
  stepWalk() {
    const w = this.walk;
    if (!w) return;
    if (!w.dirs.length) { this.walk = null; return; }
    clearTimeout(w.timer);
    w.timer = setTimeout(() => {
      if (this.walk === w && connected) sendCommand(w.dirs.shift(), false);
    }, 250);
  },
  cancelWalk() { if (this.walk) { clearTimeout(this.walk.timer); this.walk = null; } },

  syncView() {
    const cur = this.data.rooms[this.data.cur];
    if (cur && this.view.follow) { this.view.cx = cur.x; this.view.cy = cur.y; this.view.z = cur.z; }
  },

  /* drawing */
  /* Redraws are coalesced: any number of render() calls in a frame cost one draw(). */
  render() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => { this._raf = 0; this.draw(); });
  },
  draw() {
    const cv = $("map"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement), css = n => cs.getPropertyValue(n).trim();
    const C = { edge: css("--edge"), accent: css("--accent"), room: css("--room"), line: css("--room-line"), good: css("--good"), text: css("--text"), dim: css("--dim") };
    const V = this.view, S = V.scale, px = x => w / 2 + (x - V.cx) * S, py = y => h / 2 + (y - V.cy) * S;
    const R = this.data.rooms, E = this.data.edges, half = Math.max(2, S * 0.28);

    /* Only rooms near the viewport matter. A room at most one cell outside it can still own an edge
       that reaches in, and each edge is found from one end by looking along e, s, se and ne. */
    let nrooms = 0;
    const vis = [];
    for (const k in R) {
      nrooms++;
      const r = R[k];
      if (r.z !== V.z) continue;
      const x = px(r.x), y = py(r.y);
      if (x < -S || y < -S || x > w + S || y > h + S) continue;
      vis.push({ k, r, x, y });
    }
    $("zLabel").textContent = "Z " + V.z;
    $("coords").textContent = nrooms ? `${nrooms} rooms` : "Move to start mapping";

    ctx.lineWidth = Math.max(1.5, S * 0.05); ctx.strokeStyle = C.edge;
    ctx.beginPath();
    for (const { k, r, x, y } of vis) {
      for (const [dx, dy] of FORWARD) {
        const nk = this.rk(r.x + dx, r.y + dy, r.z);
        if (R[nk] && E[this.edgeKey(k, nk)]) { ctx.moveTo(x, y); ctx.lineTo(x + dx * S, y + dy * S); }
      }
    }
    ctx.stroke();

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `${Math.max(9, S * 0.2)}px system-ui, sans-serif`;
    for (const { k, r, x, y } of vis) {
      const isCur = k === this.data.cur, isSel = k === this.selected;
      ctx.fillStyle = isCur ? C.accent : C.room;
      ctx.strokeStyle = isSel ? C.good : C.line;
      ctx.lineWidth = isSel ? 3 : 1.5;
      ctx.fillRect(x - half, y - half, half * 2, half * 2);
      ctx.strokeRect(x - half, y - half, half * 2, half * 2);
      const upKey = this.rk(r.x, r.y, r.z + 1), downKey = this.rk(r.x, r.y, r.z - 1);
      const up = R[upKey] && E[this.edgeKey(k, upKey)], down = R[downKey] && E[this.edgeKey(k, downKey)];
      if (up || down) {
        ctx.fillStyle = isCur ? "#07131f" : C.text;
        if (up) ctx.fillText("▲", x + half * 0.45, y - half * 0.4);
        if (down) ctx.fillText("▼", x + half * 0.45, y + half * 0.4);
      }
      if (r.name && S >= 36) {
        ctx.fillStyle = C.dim;
        ctx.fillText(r.name.length > 14 ? r.name.slice(0, 13) + "…" : r.name, x, y + half + S * 0.16);
      }
    }
  },
  roomAt(mx, my) {
    const cv = $("map"), V = this.view, S = V.scale, half = Math.max(4, S * 0.32);
    for (const k in this.data.rooms) {
      const r = this.data.rooms[k];
      if (r.z !== V.z) continue;
      const x = cv.clientWidth / 2 + (r.x - V.cx) * S, y = cv.clientHeight / 2 + (r.y - V.cy) * S;
      if (Math.abs(mx - x) <= half && Math.abs(my - y) <= half) return k;
    }
    return null;
  },
  select(k) {
    this.selected = k;
    const r = this.data.rooms[k];
    $("selBar").hidden = !r;
    if (r) $("sel").textContent = `${r.name || "Room"} (${r.x}, ${-r.y}, ${r.z})`;
    this.render();
  },
};

/* map interactions */
(() => {
  const cv = $("map");
  let drag = null;
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, moved: false }; cv.style.cursor = "grabbing"; };
  cv.onpointermove = e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (!drag.moved) return;
    const V = mapper.view;
    V.cx -= dx / V.scale; V.cy -= dy / V.scale; V.follow = false;
    drag.x = e.clientX; drag.y = e.clientY;
    mapper.render();
  };
  cv.onpointerup = e => {
    cv.style.cursor = "grab";
    if (drag && !drag.moved) {
      const r = cv.getBoundingClientRect();
      mapper.select(mapper.roomAt(e.clientX - r.left, e.clientY - r.top));
    }
    drag = null;
  };
  const zoom = f => {
    mapper.view.scale = Math.min(120, Math.max(2, mapper.view.scale * f));
    mapper.render();
  };
  cv.onwheel = e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12); };
  $("zoomIn").onclick = () => zoom(1.25);
  $("zoomOut").onclick = () => zoom(1 / 1.25);
  cv.ondblclick = e => {
    const r = cv.getBoundingClientRect(), k = mapper.roomAt(e.clientX - r.left, e.clientY - r.top);
    if (k) { mapper.select(k); $("rename").click(); }
  };
  new ResizeObserver(() => mapper.render()).observe(cv);
})();

const level = d => { const V = mapper.view; V.z += d; V.follow = false; mapper.render(); };
$("zUp").onclick = () => level(1);
$("zDown").onclick = () => level(-1);
$("center").onclick = () => { mapper.view.follow = true; mapper.syncView(); mapper.render(); };
$("here").onclick = () => { if (mapper.selected) { mapper.data.cur = mapper.selected; mapper.save(); mapper.syncView(); mapper.render(); } };
$("walk").onclick = () => { if (mapper.selected) mapper.startWalk(mapper.selected); };
$("rename").onclick = () => {
  const r = mapper.data.rooms[mapper.selected];
  if (!r) return;
  const n = prompt("Room name", r.name);
  if (n !== null) { r.name = n.trim(); mapper.save(); mapper.select(mapper.selected); }
};
$("del").onclick = () => {
  const k = mapper.selected, d = mapper.data;
  if (!k) return;
  delete d.rooms[k];
  for (const e in d.edges) if (e.split("|").includes(k)) delete d.edges[e];
  if (d.cur === k) d.cur = null;
  mapper.save(); mapper.select(null);
};

/* settings, export/import */
const savedOpts = (() => { try { return JSON.parse(store.get("mud:opts")); } catch (e) { return null; } })();
Object.assign(mapper.opts, savedOpts || {});
$("mapOn").checked = mapper.opts.on;
$("nameOn").checked = mapper.opts.name;
$("blocked").value = mapper.opts.blocked;
$("aliases").value = mapper.opts.aliases;
const loadAliases = () => { $("aliasCount").textContent = mapper.parseAliases(mapper.opts.aliases) + " recognised"; };
loadAliases();
$("aliases").oninput = e => { mapper.opts.aliases = e.target.value; loadAliases(); saveOpts(); };
const saveOpts = () => store.set("mud:opts", JSON.stringify(mapper.opts));
$("mapOn").onchange = e => { mapper.opts.on = e.target.checked; mapper.reset(); saveOpts(); };
$("nameOn").onchange = e => { mapper.opts.name = e.target.checked; saveOpts(); };
$("blocked").oninput = e => {
  try { new RegExp(e.target.value); e.target.style.borderColor = ""; mapper.opts.blocked = e.target.value; saveOpts(); }
  catch (err) { e.target.style.borderColor = "var(--bad)"; }
};
for (const [id, key] of [["promptRe", "prompt"], ["doEnd", "doEnd"]]) {
  $(id).value = mapper.opts[key];
  $(id).oninput = e => {
    try { new RegExp(e.target.value); e.target.style.borderColor = ""; mapper.opts[key] = e.target.value; saveOpts(); }
    catch (err) { e.target.style.borderColor = "var(--bad)"; }
  };
}
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(mapper.data)], { type: "application/json" }));
  a.download = (mapper.key || "mudmap").replace(/[^\w.-]+/g, "_") + ".json";
  a.click(); URL.revokeObjectURL(a.href);
};
$("import").onclick = () => $("file").click();
$("file").onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d.rooms || !d.edges) throw new Error("not a map file");
    mapper.data = d; mapper.save(); mapper.select(null); mapper.syncView();
  } catch (err) { alert("Could not import: " + err.message); }
  e.target.value = "";
};
/* saved maps */
const cleanName = n => (n || "").trim().replace(/\s+/g, " ");
$("mapSel").onchange = e => mapper.choose(e.target.value);
$("mapNew").onclick = () => {
  const name = cleanName(prompt("Name for the new map"));
  if (!name) return;
  const key = "mudmap:" + name;
  if (store.get(key) !== null && !confirm(`A map named "${name}" already exists. Replace it with an empty one?`)) return;
  store.set(key, JSON.stringify({ rooms: {}, edges: {}, cur: null }));
  mapper.choose(key);
};
$("mapSaveAs").onclick = () => {
  const name = cleanName(prompt("Save this map as", mapper.key.slice(7)));
  if (!name) return;
  const key = "mudmap:" + name;
  if (key !== mapper.key && store.get(key) !== null && !confirm(`A map named "${name}" already exists. Overwrite it?`)) return;
  mapper.flush();
  store.set(key, JSON.stringify(mapper.data));
  mapper.choose(key);
};
$("mapDelete").onclick = () => {
  const key = mapper.key;
  if (!confirm(`Delete the map "${key.slice(7)}"? This can't be undone.`)) return;
  clearTimeout(mapper._t);
  store.del(key);
  mapper.key = null;
  const fallback = "mudmap:" + mapper.server;
  store.set("mud:map:" + mapper.server, fallback);
  mapper.open(fallback);
};
/* find a room by name, to select it and then use Set here */
let findAt = 0, findFor = "";
$("find").oninput = () => { findAt = 0; $("find").style.borderColor = ""; };
$("find").onkeydown = e => {
  if (e.key !== "Enter") return;
  const q = $("find").value.trim().toLowerCase();
  if (!q) return;
  if (q !== findFor) { findFor = q; findAt = 0; }
  const hits = Object.keys(mapper.data.rooms).filter(k => mapper.data.rooms[k].name.toLowerCase().includes(q));
  $("find").style.borderColor = hits.length ? "" : "var(--bad)";
  if (!hits.length) return;
  const k = hits[findAt++ % hits.length], r = mapper.data.rooms[k], V = mapper.view;
  V.cx = r.x; V.cy = r.y; V.z = r.z; V.follow = false;
  mapper.select(k);
};
$("clear").onclick = () => {
  if (!confirm("Delete the whole map for this server?")) return;
  mapper.data = { rooms: {}, edges: {}, cur: null }; mapper.save(); mapper.select(null);
};

/* draggable divider between terminal and map */
(() => {
  const main = document.querySelector("main"), split = $("split");
  const setWidth = px => {
    if (px == null) main.style.removeProperty("--map-w");
    else main.style.setProperty("--map-w", Math.round(Math.min(main.clientWidth - 206, Math.max(120, px))) + "px");
    mapper.render();
  };
  split.onpointerdown = e => { split.setPointerCapture(e.pointerId); split.classList.add("on"); };
  split.onpointermove = e => {
    if (split.classList.contains("on")) setWidth(main.getBoundingClientRect().right - e.clientX - 3);
  };
  split.onpointerup = () => {
    split.classList.remove("on");
    store.set("mud:mapw", main.style.getPropertyValue("--map-w"));
  };
  split.ondblclick = () => { setWidth(null); store.set("mud:mapw", ""); };
  const saved = store.get("mud:mapw");
  if (saved) main.style.setProperty("--map-w", saved);
})();

/* draggable divider above the pinned live area */
(() => {
  const split = $("splitH"), term = $("term");
  const setHeight = px => {
    if (px == null) term.style.removeProperty("--live-h");
    else term.style.setProperty("--live-h", Math.round(Math.min(term.clientHeight - 150, Math.max(40, px))) + "px");
    syncLive();
  };
  split.onpointerdown = e => { split.setPointerCapture(e.pointerId); split.classList.add("on"); };
  split.onpointermove = e => {
    if (split.classList.contains("on")) setHeight(live.getBoundingClientRect().bottom - e.clientY - 3);
  };
  split.onpointerup = () => {
    split.classList.remove("on");
    store.set("mud:liveh", term.style.getPropertyValue("--live-h"));
  };
  split.ondblclick = () => { setHeight(null); store.set("mud:liveh", ""); };
  const saved = store.get("mud:liveh");
  if (saved) term.style.setProperty("--live-h", saved);
})();

/* startup */
try { const l = JSON.parse(store.get("mud:last")); if (l) { $("host").value = l.host; $("port").value = l.port; } } catch (e) {}
mapper.load($("host").value.trim(), $("port").value.trim());
print("Enter a host and port, then Connect.\nMovement commands (n, s, e, w, ne, nw, se, sw, u, d) are mapped automatically.\nClick a room to select it, then Walk to travel there. Drag to pan, scroll to zoom.\n", "sys");
</script>
</body>
</html>
